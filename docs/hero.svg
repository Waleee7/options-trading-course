<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Options Lab: most people lose money trading options</title>
  <desc id="d">Animated banner. A profit and loss curve for an iron condor is drawn while a marker moves along it.</desc>
  <style>
    .bg{fill:#14130f}
    .rule{stroke:#34322a;stroke-width:1}
    .zero{stroke:#f3f0e6;stroke-width:1.5}
    .k{font:600 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;fill:#b4ae9a}
    .h{font:800 47px Georgia,'Times New Roman',serif;fill:#f3f0e6;letter-spacing:-1.5px}
    .h2{font:800 47px Georgia,'Times New Roman',serif;fill:#ff7350;letter-spacing:-1.5px}
    .s{font:500 17px Georgia,'Times New Roman',serif;fill:#b4ae9a}
    .m{font:600 12px ui-monospace,Menlo,Consolas,monospace;fill:#b4ae9a}
    .exp{fill:none;stroke:#b4ae9a;stroke-width:2;stroke-dasharray:6 5}
    .tod{fill:none;stroke:#f3f0e6;stroke-width:3;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s .5s ease-out forwards}
    .l1{opacity:0;animation:rise .7s .1s ease-out forwards}
    .l2{opacity:0;animation:rise .7s .35s ease-out forwards}
    .l3{opacity:0;animation:rise .7s .6s ease-out forwards}
    .gain{fill:#4fd694;opacity:.16}
    .loss{fill:#ff7350;opacity:.16}
    .dot{transform:translate(920.0px,118.5px);animation:ride 9s 3s ease-in-out infinite}
    .ring{fill:#4fd694;stroke:#14130f;stroke-width:3}
    .pulse{fill:none;stroke:#4fd694;stroke-width:2;opacity:0;animation:pulse 3s 3s ease-out infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes ride{0%{transform:translate(920.0px,118.5px)}13%{transform:translate(890.0px,125.6px)}25%{transform:translate(860.0px,148.2px)}38%{transform:translate(890.0px,125.6px)}50%{transform:translate(920.0px,118.5px)}63%{transform:translate(950.0px,128.0px)}75%{transform:translate(980.0px,149.8px)}88%{transform:translate(950.0px,128.0px)}100%{transform:translate(920.0px,118.5px)}}
    @keyframes pulse{0%{opacity:.8;r:7px}100%{opacity:0;r:22px}}
    @media (prefers-reduced-motion: reduce){
      .tod{animation:none;stroke-dashoffset:0}
      .l1,.l2,.l3{animation:none;opacity:1}
      .dot{animation:none}
      .pulse{animation:none;opacity:0}
    }
  </style>
  <rect class="bg" width="1200" height="300"/>
  <rect x="0" y="0" width="1200" height="6" fill="#ff7350"/>
  <text class="k l1" x="60" y="62">OPTIONS / LAB  -  AN HONEST OPTIONS COURSE</text>
  <text class="h l1" x="60" y="130">Most people lose money</text>
  <text class="h2 l2" x="60" y="190">trading options.</text>
  <text class="s l3" x="60" y="232">A free course that starts with the truth, then teaches you</text>
  <text class="s l3" x="60" y="256">to price, size, and survive. Drag the payoff. Break the trade.</text>

