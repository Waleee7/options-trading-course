<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Options Trading Course">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1a1a4e"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <g opacity="0.18">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="240" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <polyline points="0,200 80,180 160,190 240,160 320,170 400,140 480,150 560,115 640,130 720,95 800,110 880,75 960,90 1040,55 1120,70 1200,40"
    stroke="url(#lineGrad)" stroke-width="2.5" fill="none" filter="url(#glow)"/>

  <g fill="#00d4ff">
    <circle cx="240" cy="160" r="3" opacity="0.7"/>
    <circle cx="560" cy="115" r="3" opacity="0.7"/>
    <circle cx="880" cy="75" r="3" opacity="0.7"/>
    <circle cx="1200" cy="40" r="3" opacity="0.7"/>
  </g>

  <text x="600" y="125" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="58" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">
    Options Trading Course
  </text>

  <text x="600" y="165" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="17" font-weight="400" fill="#cbd5e1" opacity="0.85" letter-spacing="0.5">
    Interactive web app — modules, quizzes, chart challenges, XP &amp; badges
  </text>

  <g transform="translate(600, 195)" opacity="0.6">
    <circle cx="-40" cy="0" r="2" fill="#00d4ff"/>
    <circle cx="-20" cy="0" r="2" fill="#00d4ff"/>
    <circle cx="0" cy="0" r="2" fill="#a78bfa"/>
    <circle cx="20" cy="0" r="2" fill="#f472b6"/>
    <circle cx="40" cy="0" r="2" fill="#f472b6"/>
  </g>
</svg>
